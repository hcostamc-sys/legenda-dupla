# Compila o app Android (protótipo) e publica o APK na release "android-prototipo".
# Link fixo para baixar no celular:
# https://github.com/hcostamc-sys/legenda-dupla/releases/download/android-prototipo/legenda-dupla-android.apk
name: App Android (protótipo)

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Compilar o APK
        run: |
          set -o pipefail
          gradle -p android assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
          cp android/app/build/outputs/apk/debug/app-debug.apk legenda-dupla-android.apk

      - name: Publicar o APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-prototipo >/dev/null 2>&1 || \
            gh release create android-prototipo --prerelease --target "$GITHUB_SHA" \
              --title "App Android (protótipo)" \
              --notes "APK de teste do Legenda Dupla. Atualizado a cada mudança na pasta android/."
          gh release upload android-prototipo legenda-dupla-android.apk build.log --clobber

      - name: Guardar o registro da compilação (se falhar)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-build-log >/dev/null 2>&1 || \
            gh release create android-build-log --prerelease --target "$GITHUB_SHA" \
              --title "Registro da compilação Android" --notes "Registro da última compilação que falhou."
          gh release upload android-build-log build.log --clobber
