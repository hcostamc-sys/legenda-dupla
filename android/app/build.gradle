plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.hcostamcsys.legendadupla'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.hcostamcsys.legendadupla'
        minSdk 26
        targetSdk 35
        versionCode 24
        versionName '0.24'
        // Voz mais clara (versão 24): o motor do modelo (onnxruntime) tem partes nativas. Só os celulares
        // ARM (praticamente todos), para o APK não crescer à toa com as versões de computador (x86).
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    // Chave fixa de teste: assim cada APK novo instala por cima do anterior, sem desinstalar.
    // Uso pessoal; não é a chave de uma versão para a Play Store.
    signingConfigs {
        debug {
            storeFile file('ld-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        // Partes nativas do onnxruntime comprimidas dentro do APK (o Android extrai na instalação):
        // o APK baixado fica bem menor.
        jniLibs {
            useLegacyPackaging true
        }
        resources {
            // Arquivos de licença e de módulos repetidos nas bibliotecas Java (NewPipe Extractor, Rhino, jsoup)
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/LICENSE.md',
                         'META-INF/NOTICE', 'META-INF/NOTICE.txt', 'META-INF/NOTICE.md', 'META-INF/INDEX.LIST',
                         'META-INF/README.md', 'META-INF/CHANGES', 'META-INF/COPYRIGHT',
                         'META-INF/versions/9/OSGI-INF/MANIFEST.MF', 'META-INF/*.kotlin_module']
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    // Puxar para atualizar o YouTube da tela inicial (versão 13)
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    // Voz mais clara (versão 24): motor do modelo de separação de voz (Microsoft, licença MIT)
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.20.0'
    // Voz mais clara: endereço do áudio do vídeo (o mesmo do app NewPipe; licença GPL-3.0). Mesma versão do NewPipe 0.29.3.
    implementation 'com.github.TeamNewPipe:NewPipeExtractor:v0.27.1'
}
