plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.hcostamcsys.legendadupla'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.hcostamcsys.legendadupla'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1-prototipo'
    }

    // Chave fixa de teste: assim cada APK novo instala por cima do anterior, sem desinstalar.
    // Uso pessoal; não é a chave de uma versão para a Play Store.
    signingConfigs {
        debug {
            storeFile file('ld-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
