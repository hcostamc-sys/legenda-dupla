// App Android do Legenda Dupla (protótipo). Compilado pelo GitHub Actions (.github/workflows/android.yml).
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = 'LegendaDupla'
include ':app'
