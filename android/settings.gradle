// App Android do Legenda Dupla (protótipo). Compilado pelo GitHub Actions (.github/workflows/android.yml).
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // NewPipe Extractor (voz mais clara, versão 22) só é publicado pelo JitPack
        maven { url 'https://jitpack.io' }
    }
}
rootProject.name = 'LegendaDupla'
include ':app'
